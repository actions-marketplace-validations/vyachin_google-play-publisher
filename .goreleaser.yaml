version: 2

project_name: google-play-publisher

builds:
  - id: google-play-publisher
    main: ./cmd/google-play-publisher
    binary: google-play-publisher
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/vyachin/google-play-publisher/internal/version.Version={{ .Version }}
      - -X github.com/vyachin/google-play-publisher/internal/version.Commit={{ .Commit }}
      - -X github.com/vyachin/google-play-publisher/internal/version.Date={{ .Date }}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
